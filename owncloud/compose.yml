services:
  owncloud:
    image: owncloud/server:10.13
    container_name: owncloud
    restart: unless-stopped
    ports:
      - 85:8080
    volumes:
      - owncloud_files:/mnt/data
    environment:
      OWNCLOUD_DOMAIN: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: ${MYSQL_DATABASE:-owncloud_db}
      OWNCLOUD_DB_USERNAME: ${MYSQL_USER:-owncloud}
      OWNCLOUD_DB_PASSWORD: ${MYSQL_PASSWORD:-owncloud_pass}
      OWNCLOUD_DB_HOST: mysql
      OWNCLOUD_ADMIN_USERNAME: ${OWNCLOUD_ADMIN_USERNAME}
      OWNCLOUD_ADMIN_PASSWORD: ${OWNCLOUD_ADMIN_PASSWORD}
      OWNCLOUD_REDIS_ENABLED: "false"
      OWNCLOUD_DEBUG: "false"
      OWNCLOUD_TRUSTED_DOMAINS: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_OVERWRITEHOST: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_OVERWRITEPROTOCOL: https
      OWNCLOUD_OVERWRITECLIURL: https://${OWNCLOUD_DOMAIN}
    networks:
      - saarlandletsplay-external
      - saarlandletsplay-internal
      - my_ipv6_net
    external_links:
      - mysql:mysql
volumes:
  owncloud_files: null
networks:
  my_ipv6_net:
    external: true
  saarlandletsplay-external:
    external: true
  saarlandletsplay-internal:
    external: true
