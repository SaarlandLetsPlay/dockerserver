# 🏭 **Factorio Server Docker Compose**
# Konfigurierbarer Factorio Server mit automatischen Updates und Mods

services:
  factorio:
    image: factoriotools/factorio:latest
    container_name: factorio
    restart: unless-stopped
    environment:
      # 🔧 **Server-Konfiguration**
      # Server-Name
      FACTORIO_SERVER_NAME: ${FACTORIO_SERVER_NAME:-SaarlandLetsPlay Factorio}
      
      # Server-Passwort (leer für öffentlich)
      FACTORIO_SERVER_PASSWORD: ${FACTORIO_SERVER_PASSWORD:-}
      
      # Server-Beschreibung
      FACTORIO_SERVER_DESCRIPTION: ${FACTORIO_SERVER_DESCRIPTION:-Willkommen auf dem SaarlandLetsPlay Factorio Server!}
      
      # 🌐 **Game-Einstellungen**
      # Spiel-Typ: normal, peaceful
      FACTORIO_GAME_TYPE: ${FACTORIO_GAME_TYPE:-normal}
      
      # Maximale Spieleranzahl
      FACTORIO_MAX_PLAYERS: ${FACTORIO_MAX_PLAYERS:-10}
      
      # Auto-Pause wenn keine Spieler online
      FACTORIO_AUTO_PAUSE: ${FACTORIO_AUTO_PAUSE:-true}
      
      # Verifikation von Spielern
      FACTORIO_VERIFY_PLAYER_IDENTIFICATION: ${FACTORIO_VERIFY_PLAYER_IDENTIFICATION:-true}
      
      # 🗺️ **Welt-Einstellungen**
      # Welt-Name
      FACTORIO_WORLD_NAME: ${FACTORIO_WORLD_NAME:-saarlandletsplay}
      
      # Welt-Seed (leer für zufällig)
      FACTORIO_WORLD_SEED: ${FACTORIO_WORLD_SEED:-}
      
      # Welt-Größe: none, very-small, small, medium, large, very-large
      FACTORIO_WORLD_SIZE: ${FACTORIO_WORLD_SIZE:-medium}
      
      # Wasserreich: none, low, normal, high
      FACTORIO_WORLD_WATER: ${FACTORIO_WORLD_WATER:-normal}
      
      # Ressourcen: very-poor, poor, regular, rich, very-rich
      FACTORIO_WORLD_RESOURCES: ${FACTORIO_WORLD_RESOURCES:-regular}
      
      # Feinde: none, very-low, low, normal, high, very-high
      FACTORIO_WORLD_ENEMIES: ${FACTORIO_WORLD_ENEMIES:-normal}
      
      # Evolution-Faktor: 0.0 bis 1.0
      FACTORIO_WORLD_EVOLUTION: ${FACTORIO_WORLD_EVOLUTION:-0.5}
      
      # 🚀 **Technologie-Einstellungen**
      # Forschungsgeschwindigkeit: 0.1 bis 10.0
      FACTORIO_TECHNOLOGY_SPEED: ${FACTORIO_TECHNOLOGY_SPEED:-1.0}
      
      # Forschungskosten-Multiplikator: 0.1 bis 10.0
      FACTORIO_TECHNOLOGY_COST: ${FACTORIO_TECHNOLOGY_COST:-1.0}
      
      # 📦 **Mod-Konfiguration**
      # Mods automatisch aktualisieren
      FACTORIO_UPDATE_MODS_ON_START: ${FACTORIO_UPDATE_MODS_ON_START:-true}
      
      # Mod-Pack URL (optional)
      FACTORIO_MODPACK_URL: ${FACTORIO_MODPACK_URL:-}
      
      # 🌐 **Network-Einstellungen**
      # Server-Port
      FACTORIO_PORT: ${FACTORIO_PORT:-34197}
      
      # RCON-Port
      FACTORIO_RCON_PORT: ${FACTORIO_RCON_PORT:-27015}
      
      # RCON-Passwort
      FACTORIO_RCON_PASSWORD: ${FACTORIO_RCON_PASSWORD:-factorio_admin}
      
      # RCON aktivieren
      FACTORIO_ENABLE_RCON: ${FACTORIO_ENABLE_RCON:-true}
      
      # 📊 **Performance-Einstellungen**
      # Maximale Tick-Rate
      FACTORIO_MAX_TICKS_PER_MINUTE: ${FACTORIO_MAX_TICKS_PER_MINUTE:-60}
      
      # Auto-Save Intervall (in Minuten)
      FACTORIO_SAVE_INTERVAL: ${FACTORIO_SAVE_INTERVAL:-10}
      
      # Maximale Anzahl an Saves
      FACTORIO_SAVE_COUNT: ${FACTORIO_SAVE_COUNT:-5}
      
      # 🔧 **Admin-Einstellungen**
      # Admin-Liste (kommagetrennt)
      FACTORIO_ADMINS: ${FACTORIO_ADMINS:-}
      
      # Whitelist (kommagetrennt)
      FACTORIO_WHITELIST: ${FACTORIO_WHITELIST:-}
      
      # Ban-Liste (kommagetrennt)
      FACTORIO_BANLIST: ${FACTORIO_BANLIST:-}
      
      # 🎮 **Spiel-Regeln**
      # Cheat-Modus
      FACTORIO_CHEAT_MODE: ${FACTORIO_CHEAT_MODE:-false}
      
      # Unbegrenzte Ressourcen
      FACTORIO_UNLIMITED_RESOURCES: ${FACTORIO_UNLIMITED_RESOURCES:-false}
      
      # Hand-Crafting deaktivieren
      FACTORIO_DISABLE_HAND_CRAFTING: ${FACTORIO_DISABLE_HAND_CRAFTING:-false}
      
      # 🌐 **Web-Interface**
      # Web-Modus aktivieren
      FACTORIO_ENABLE_WEB: ${FACTORIO_ENABLE_WEB:-true}
      
      # Web-Port
      FACTORIO_WEB_PORT: ${FACTORIO_WEB_PORT:-80}
      
      # 📁 **Backup-Einstellungen**
      # Automatische Backups
      FACTORIO_ENABLE_BACKUPS: ${FACTORIO_ENABLE_BACKUPS:-true}
      
      # Backup-Intervall (in Stunden)
      FACTORIO_BACKUP_INTERVAL: ${FACTORIO_BACKUP_INTERVAL:-6}
      
      # Maximale Anzahl an Backups
      FACTORIO_BACKUP_COUNT: ${FACTORIO_BACKUP_COUNT:-24}
      
    ports:
      - "${FACTORIO_PORT:-34197}:34197/udp"  # Factorio Game Port
      - "${FACTORIO_RCON_PORT:-27015}:27015/tcp"  # RCON Port
      - "${FACTORIO_WEB_PORT:-80}:80/tcp"  # Web Interface
    
    volumes:
      - ./data:/factorio
      - ./mods:/mods
      - ./config:/config
      - ./saves:/saves
      - ./backups:/backups
      - ./scenarios:/scenarios
    
    stdin_open: true
    tty: true
    
    networks:
      - saarlandletsplay-internal
      - saarlandletsplay-external
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FACTORIO_WEB_PORT:-80}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource-Limits
    deploy:
      resources:
        limits:
          memory: ${FACTORIO_MEMORY_LIMIT:-4G}
          cpus: '${FACTORIO_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${FACTORIO_MEMORY_RESERVATION:-2G}
          cpus: '${FACTORIO_CPU_RESERVATION:-1.0}'

networks:
  saarlandletsplay-internal:
    external: true
  saarlandletsplay-external:
    external: true

volumes:
  factorio_data:
    driver: local
  factorio_saves:
    driver: local
  factorio_backups:
    driver: local
