services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    environment:
      WEBSOCKET_ENABLED: "true"
      DOMAIN: https://passwort.example.com
      ADMIN_TOKEN: $$argon2id$$v=19$$m=65540,t=3,p=4$$cKdSXfzWbrESymK3b78SM1GbIH1aB8l0pfC0PLNrGik$$5gFed7262oYrkpsgAEXeGQxpZz1Nwkc7qf9PNwDWsB0
      SIGNUPS_ALLOWED: "true" # Nur Admin kann Benutzer erstellen
      DATABASE_URL: postgresql://vaultwarden:vaultwarden_pass@postgresql:5432/vaultwarden_db
    ports:
      - 8083:80
    volumes:
      - /opt/stacks/vaultwarden/data:/data
    networks:
      - external
      - internal
      - my_ipv6_net
networks:
  external:
    external: true
    name: saarlandletsplay-external
  internal:
    external: true
    name: saarlandletsplay-internal
  my_ipv6_net:
    external: true

